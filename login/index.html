<script>

/* ======================================
   CAMILA SWEETRUSH LOGIN
   ADMIN + KONSUMEN
====================================== */


/* ======================================
   ROLE
====================================== */

let selectedRole = "Admin";

const consumerNameGroup =
  document.getElementById("consumerNameGroup");

const consumerName =
  document.getElementById("consumerName");


/* ======================================
   ROLE BUTTON
====================================== */

document
  .querySelectorAll(".role-btn")
  .forEach(function(button){

    button.addEventListener(
      "click",
      function(){

        document
          .querySelectorAll(".role-btn")
          .forEach(function(btn){

            btn.classList.remove("active");

          });


        this.classList.add("active");


        selectedRole =
          this.dataset.role;


        /* =========================
           KONSUMEN
        ========================= */

        if(selectedRole === "Konsumen"){

          consumerNameGroup.style.display =
            "block";

        }

        /* =========================
           ADMIN
        ========================= */

        else{

          consumerNameGroup.style.display =
            "none";

          consumerName.value = "";

        }

      }
    );

  });


/* ======================================
   PHONE
====================================== */

const phone =
  document.getElementById("phone");


phone.addEventListener(
  "input",
  function(){

    this.value =
      this.value.replace(/\D/g,"");

  }
);


/* ======================================
   PASSWORD
====================================== */

const password =
  document.getElementById("password");


const togglePassword =
  document.getElementById("togglePassword");


togglePassword.addEventListener(
  "click",
  function(){

    if(password.type === "password"){

      password.type = "text";

      this.setAttribute(
        "aria-label",
        "Sembunyikan sandi"
      );

    }

    else{

      password.type = "password";

      this.setAttribute(
        "aria-label",
        "Tampilkan sandi"
      );

    }

  }
);


/* ======================================
   TOAST
====================================== */

function showToast(message){

  const toast =
    document.getElementById("toast");


  toast.textContent =
    message;


  toast.classList.add("show");


  setTimeout(
    function(){

      toast.classList.remove("show");

    },
    2800
  );

}


/* ======================================
   REMEMBER PHONE
====================================== */

const remembered =
  localStorage.getItem(
    "camila_remembered_user"
  );


if(remembered){

  phone.value =
    remembered;


  document.getElementById(
    "remember"
  ).checked = true;

}


/* ======================================
   LOGIN
====================================== */

document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    function(){

      const phoneNumber =
        phone.value.trim();


      const passwordValue =
        password.value.trim();


      const customerNameValue =
        consumerName.value.trim();


      const remember =
        document.getElementById(
          "remember"
        ).checked;


      /* =========================
         VALIDASI NO HP
      ========================= */

      if(!phoneNumber){

        showToast(
          "Silakan masukkan No HP."
        );

        phone.focus();

        return;

      }


      if(phoneNumber.length < 8){

        showToast(
          "No HP belum valid."
        );

        phone.focus();

        return;

      }


      /* =========================
         VALIDASI NAMA KONSUMEN
      ========================= */

      if(
        selectedRole === "Konsumen" &&
        !customerNameValue
      ){

        showToast(
          "Silakan masukkan nama konsumen."
        );

        consumerName.focus();

        return;

      }


      /* =========================
         VALIDASI SANDI
      ========================= */

      if(!passwordValue){

        showToast(
          "Silakan masukkan sandi."
        );

        password.focus();

        return;

      }


      /* =========================
         SIMPAN DATA ADMIN
      ========================= */

      if(selectedRole === "Admin"){

        localStorage.setItem(
          "camila_user",
          phoneNumber
        );

        localStorage.setItem(
          "camila_role",
          "Admin"
        );

        localStorage.removeItem(
          "camila_customer_name"
        );

        localStorage.removeItem(
          "camila_customer_phone"
        );

      }


      /* =========================
         SIMPAN DATA KONSUMEN
      ========================= */

      if(selectedRole === "Konsumen"){

        localStorage.setItem(
          "camila_user",
          customerNameValue
        );

        localStorage.setItem(
          "camila_role",
          "Konsumen"
        );

        localStorage.setItem(
          "camila_customer_name",
          customerNameValue
        );

        localStorage.setItem(
          "camila_customer_phone",
          phoneNumber
        );

      }


      /* =========================
         INGAT SAYA
      ========================= */

      if(remember){

        localStorage.setItem(
          "camila_remembered_user",
          phoneNumber
        );

      }

      else{

        localStorage.removeItem(
          "camila_remembered_user"
        );

      }


      /* =========================
         BERHASIL
      ========================= */

      showToast(
        "Login berhasil. Selamat datang!"
      );


      /* =========================
         REDIRECT
      ========================= */

      setTimeout(
        function(){

          if(selectedRole === "Admin"){

            window.location.href =
              "../";

          }

          else if(
            selectedRole === "Konsumen"
          ){

            window.location.href =
              "../stok/";

          }

        },
        500
      );

    }
  );


/* ======================================
   ENTER KEY
====================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      document
        .getElementById("loginButton")
        .click();

    }

  }
);


/* ======================================
   FORGOT PASSWORD
====================================== */

const forgotModal =
  document.getElementById(
    "forgotModal"
  );


document
  .getElementById("forgotPassword")
  .addEventListener(
    "click",
    function(){

      forgotModal.classList.add(
        "show"
      );

    }
  );


function closeForgot(){

  forgotModal.classList.remove(
    "show"
  );

}


document
  .getElementById("closeForgot")
  .addEventListener(
    "click",
    closeForgot
  );


document
  .getElementById("forgotOk")
  .addEventListener(
    "click",
    closeForgot
  );


forgotModal.addEventListener(
  "click",
  function(event){

    if(event.target === forgotModal){

      closeForgot();

    }

  }
);

</script>
